[project]
name = "presidentielle2027-ecologie"
version = "0.3.0"
description = "L'écologie dans les tweets des candidats à la présidentielle 2027 : collecte, codage par analyse critique du discours, site pédagogique"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.14.0",
    "typesafe-sdk>=0.7.5",
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
