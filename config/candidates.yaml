# Candidats à l'élection présidentielle 2027 (1er tour : 18 avril 2027) et leurs comptes X.
#
# status  : declare   -> candidature annoncée publiquement
#           designe   -> investi par son parti / primaire
#           pressenti -> non déclaré mais suivi (désactivé par défaut)
# bloc    : famille politique (clé définie dans study.yaml), choix de codage à valider
# party_en, note, note_en : facultatifs, pour la version anglaise et les signalements
# cadrage : [x, y, zoom] du centre du visage dans la photo (fractions de la largeur et de la hauteur),
#           pour centrer les portraits ronds du site ; zoom 1 = photo entière en largeur
# noms    : façons de nommer le candidat dans un tweet, pour le réseau « qui nomme qui » (sans accents ni
#           majuscules requis). Par défaut : nom complet et patronyme. À préciser quand le patronyme est ambigu.
# enabled : false -> ignoré par le pipeline
#
# Liste établie mi-octobre 2026 (sources : France 24, Public Sénat, Touteleurope).
# Les handles X sont à vérifier avant un premier run : le pipeline s'arrête avec
# un message explicite si un handle n'existe pas.

candidates:
