    label: Référence
    start: 2026-09-01
    end: 2026-12-31
  - key: precampagne
    label: Pré-campagne
    start: 2027-01-01
    end: 2027-04-04
  - key: campagne
    label: Campagne officielle
    start: 2027-04-05
    end: 2027-04-17
  - key: entre_deux_tours
    label: 1er tour et entre-deux-tours
    start: 2027-04-18
    end: 2027-05-02

# Événements exogènes affichés sur les séries temporelles (à compléter au fil de l'étude).
