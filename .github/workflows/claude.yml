name: Codage Claude (à la demande)

# Lancement manuel : onglet Actions > Codage Claude > Run workflow, ou application GitHub mobile.
on:
  workflow_dispatch:
    inputs:
      portee:
        description: "Tweets confiés à Claude"
        type: choice
        options:
          - ecologie_et_incertains
          - incertains
          - echantillon
          - jeux
          - tous
        default: ecologie_et_incertains
      taille_echantillon:
        description: "Taille de l'échantillon de validation (portée « echantillon »)"
        type: number
        default: 300
      mode:
        description: "batch : moitié prix, résultats en général sous 1 h ; sync : immédiat (la portée « jeux » est toujours immédiate)"
        type: choice
        options:
          - batch
          - sync
        default: batch
      limite:
        description: "Nombre maximum de tweets (vide : aucune limite)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  codage:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          for name in ANTHROPIC_API_KEY DATA_REPO_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant : Settings > Secrets and variables > Actions."; exit 1; fi
          done

      - name: Récupérer le dépôt de données privé
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO || format('{0}-data', github.repository) }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Codage Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          PORTEE: ${{ inputs.portee }}
          TAILLE: ${{ inputs.taille_echantillon }}
          MODE: ${{ inputs.mode }}
          LIMITE: ${{ inputs.limite }}
        run: |
          limit=(); if [ -n "$LIMITE" ]; then limit=(--limit "$LIMITE"); fi
          if [ "$PORTEE" = "jeux" ]; then
            python -m presidentielle games "${limit[@]}"
          else
            python -m presidentielle classify --engine claude --scope "$PORTEE" --sample-size "$TAILLE" --mode "$MODE" --timeout-minutes 240 "${limit[@]}"
          fi

      - name: Validation, export et site
        run: python -m presidentielle publish --out _site

      - name: Enregistrer les données dans le dépôt privé
        if: always()
        working-directory: data
        env:
          PORTEE: ${{ inputs.portee }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Aucune donnée nouvelle."; exit 0; fi
          git commit -m "Codage Claude ($PORTEE) du $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploiement:
    needs: codage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
