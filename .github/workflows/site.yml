name: Publier le site

# Republie le site quand son code, le livre de codes ou la configuration changent.
on:
  push:
    paths:
      - "site/**"
      - "src/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  construction:
    # GitHub Pages ne déploie que depuis la branche par défaut
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      # les secrets ne peuvent pas figurer directement dans une condition « if »
      HAS_DATA: ${{ secrets.DATA_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le dépôt de données privé
        if: env.HAS_DATA == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO || format('{0}-data', github.repository) }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m presidentielle site --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploiement:
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
