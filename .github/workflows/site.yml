name: Publier le site

# Republie le site quand son code change, à partir des données déjà enregistrées.
on:
  push:
    paths:
      - "site/**"
      - "src/presidentielle/site.py"
      - "src/presidentielle/codebook.py"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  construction:
    # GitHub Pages ne déploie que depuis la branche par défaut
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Construire le site
        env:
          PYTHONPATH: src
        run: python -m presidentielle site --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploiement:
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
