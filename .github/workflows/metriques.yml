name: Réactualiser l'engagement (à la demande)

# Relit les métriques publiques (j'aime, reposts, réponses, citations, signets, vues) d'une
# période choisie. La mesure de référence, prise 48 h après la publication par la collecte
# quotidienne, n'est pas modifiée. Chaque tweet relu est une lecture facturée par l'API X.
on:
  workflow_dispatch:
    inputs:
      jours:
        description: "Tweets publiés dans les N derniers jours (vide : tous les tweets)"
        type: string
        default: "7"
      candidat:
        description: "Handle d'un seul candidat (vide : tous)"
        type: string
        default: ""
      maximum:
        description: "Nombre maximum de tweets relus (garde-fou de coût)"
        type: string
        default: "2000"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          for name in X_BEARER_TOKEN DATA_REPO_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant : Settings > Secrets and variables > Actions."; exit 1; fi
          done

      - name: Récupérer le dépôt de données privé
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO || format('{0}-data', github.repository) }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Relecture des métriques
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          JOURS: ${{ inputs.jours }}
          CANDIDAT: ${{ inputs.candidat }}
          MAXIMUM: ${{ inputs.maximum }}
        run: |
          args=(--refresh)
          if [ -n "$JOURS" ]; then args+=(--days "$JOURS"); fi
          if [ -n "$CANDIDAT" ]; then args+=(--candidate "$CANDIDAT"); fi
          if [ -n "$MAXIMUM" ]; then args+=(--max "$MAXIMUM"); fi
          python -m presidentielle metrics "${args[@]}"

      - name: Site
        run: python -m presidentielle publish --out _site

      - name: Enregistrer les données dans le dépôt privé
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Aucune donnée nouvelle."; exit 0; fi
          git commit -m "Réactualisation de l'engagement du $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploiement:
    needs: releve
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
