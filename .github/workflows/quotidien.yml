name: Collecte quotidienne

# Chaque jour : purge des comptes retirés, nouveaux tweets (rattrapage complet pour tout compte
# jamais collecté), tweets de plus de 48 h seulement (métriques stabilisées, une seule lecture X),
# codage Jev, récupération des lots Claude terminés, validation, export, puis site.
# Les données vivent dans le dépôt privé <ce dépôt>-data (ou la variable DATA_REPO).
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, soit 6 h 17 en hiver et 7 h 17 en été à Paris
    # Rattrapage : GitHub n'accepte qu'un seul run en attente par groupe « pipeline », et en annule
    # un plus ancien quand un autre arrive (ex. un push pendant un long codage Claude). À 11:17 UTC,
    # la collecte ne s'exécute que si aucune collecte n'a abouti aujourd'hui.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    outputs:
      faire: ${{ steps.c.outputs.faire }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" != "17 11 * * *" ]; then echo "faire=oui" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/quotidien.yml/runs?status=success&created=%3E%3D$today&per_page=20" \
            | jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
          if [ "$n" -gt 0 ]; then
            echo "Collecte du jour déjà faite : pas de rattrapage."; echo "faire=non" >> "$GITHUB_OUTPUT"
          else
            echo "Aucune collecte aboutie aujourd'hui : rattrapage."; echo "faire=oui" >> "$GITHUB_OUTPUT"
          fi

  collecte:
    needs: controle
    if: needs.controle.outputs.faire == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          for name in X_BEARER_TOKEN TYPESAFE_API_KEY DATA_REPO_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant : Settings > Secrets and variables > Actions."; exit 1; fi
          done

      - name: Récupérer le dépôt de données privé
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO || format('{0}-data', github.repository) }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Collecte, codage Jev et site
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python -m presidentielle daily --out _site

      - name: Enregistrer les données dans le dépôt privé
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Aucune donnée nouvelle."; exit 0; fi
          git commit -m "Collecte du $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploiement:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
