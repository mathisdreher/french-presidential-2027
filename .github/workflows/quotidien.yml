name: Collecte quotidienne

# Chaque jour : nouveaux tweets (rattrapage complet depuis le début de l'étude pour tout
# compte jamais collecté), codage Jev, récupération des batches Claude terminés,
# rapports, validation, puis publication du site sur GitHub Pages.
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC, soit 6 h 17 (hiver) ou 7 h 17 (été) à Paris
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les secrets
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          for name in X_BEARER_TOKEN TYPESAFE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name manquant : Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Collecte, codage Jev, rapports et site
        env:
          PYTHONPATH: src
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python -m presidentielle daily --out _site

      - name: Enregistrer les données dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Aucune donnée nouvelle."; exit 0; fi
          git commit -m "Données : collecte du $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploiement:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
